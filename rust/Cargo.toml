[workspace]
resolver = "2"
members = [
    "aibox-core",
    "rsxm/crates/rsxm-core",
    "rsxm/crates/rsxm-rules",
    "rsxm/crates/rsxm-config",
    "rsxm/crates/rsxm-dns",
    "rsxm/crates/rsxm-dialer",
    "rsxm/crates/rsxm-tun",
    "rsxm/crates/rsxm-socks5",
    "rsxm/crates/rsxm-stats",
    "rsxm/crates/rsxm-power",
    "rsxm/crates/rsxm-security",
    "rsxm/crates/rsxm-agent",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0"

[profile.release]
opt-level = "z"     # size-optimized for Android .so
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
