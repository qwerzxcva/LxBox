[package]
name = "rsxm-dialer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rsxm-core = { path = "../rsxm-core" }
serde_json = "1"
# Crypto primitives (pure-Rust stacks only: cross-compiles to aarch64-android
# without cmake/llvm build hosts).
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
curve25519-dalek = "4"
ed25519-dalek = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# HKDF for TLS 1.3 key schedule.
hkdf = "0.12"
md-5 = "0.10"

[features]
tls-debug = []
