[package]
name = "rsxm-rules"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rsxm-core = { path = "../rsxm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust RE2-style engine (linear time, no backtracking): the same
# guarantee sing-box gets from Go's regexp, and the reason a pathological
# rule pattern can never stall the packet thread.
regex = "1"
