[package]
name = "aibox-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "aibox_core"

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rsxm-rules = { path = "../rsxm/crates/rsxm-rules" }
rsxm-core = { path = "../rsxm/crates/rsxm-core" }
rsxm-config = { path = "../rsxm/crates/rsxm-config" }
rsxm-dns = { path = "../rsxm/crates/rsxm-dns" }
rsxm-dialer = { path = "../rsxm/crates/rsxm-dialer" }
rsxm-power = { path = "../rsxm/crates/rsxm-power" }
rsxm-security = { path = "../rsxm/crates/rsxm-security" }
rsxm-stats = { path = "../rsxm/crates/rsxm-stats" }
rsxm-tun = { path = "../rsxm/crates/rsxm-tun" }
rsxm-socks5 = { path = "../rsxm/crates/rsxm-socks5" }
