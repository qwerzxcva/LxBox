# LxBox Android — Kotlin/Compose build
#
# Boots the Gradle wrapper for android/ and runs assembleDebug. Triggers on
# any push or PR that touches the Android subtree; Flutter changes go
# through .github/workflows/ci.yml, this one is decoupled.
#
# The Flutter `ci.yml` only triggers its `android` job on tag pushes or
# workflow_dispatch, so without this file our Kotlin sources would have no
# PR-time validation — every regression would slip through to the release
# tag. This workflow plugs that gap.
#
# We stay debug-only for now: signed release APKs require an upload keystore
# secret (Flutter ci.yml already uses ANDROID_KEYSTORE_BASE64 for that, and
# we can plug into the same secret when we're ready).

name: Android

on:
  push:
    branches: [main, develop]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # AGP reads ANDROID_HOME / ANDROID_SDK_ROOT from the env at task
      # start. We set them at the job level so assembleDebug and the
      # smoke-test step don't have to repeat the export. The path matches
      # where ubuntu-latest runners ship their preinstalled cmdline-tools.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        # Speeds up successive runs by ~30s on warm caches. Keyed on the lock
        # files so a libs.versions.toml bump invalidates the cache cleanly.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/build
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/build.gradle.kts', 'android/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        # The runner images ship cmdline-tools 20.0 at
        # /usr/local/lib/android/sdk/cmdline-tools/20.0 — which means we
        # only need to install the platform packages, not the tools. We
        # avoid android-actions/setup-android entirely because both v3 and
        # v4 fail the license-accept step on the preinstalled cmdline-tools
        # binaries:
        #
        #   `6 of 7 SDK package licenses not accepted.`
        #   `Review licenses that have not been accepted (y/N)?`
        #
        # The action pipes stdin to sdkmanager to accept licenses, but
        # cmdline-tools 12.0/20.0 still hangs after the 6th prompt on the
        # google-tv addon license; the action then never gets a chance to
        # install our requested packages. Piping `yes` ourselves works
        # because each `y\n` consumed corresponds to one of the licenses
        # sdkmanager prints.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Hard-code the SDK root: the preinstalled cmdline-tools path is
          # stable across ubuntu-latest runners, and using the absolute
          # path means we don't have to rely on whichever of ANDROID_HOME /
          # ANDROID_SDK_ROOT the runner happened to pre-populate.
          ANDROID_SDK="/usr/local/lib/android/sdk"
          export ANDROID_HOME="$ANDROID_SDK"
          export ANDROID_SDK_ROOT="$ANDROID_SDK"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/20.0/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not at $SDKMANAGER"; ls -la "$ANDROID_SDK/cmdline-tools/"; exit 1; }
          # Pre-create the licenses dir so the first run doesn't fail on a
          # missing parent when writing the license-hash files.
          mkdir -p "$ANDROID_HOME/licenses"
          echo "==> Accepting SDK licenses"
          # `yes` keeps streaming y's after sdkmanager stops reading, so the
          # pipe eventually gets SIGPIPE on yes — not an error for our
          # purposes. `set -o pipefail` is on, so we wrap in `|| true` and
          # then check that the licenses directory now contains entries
          # (the only real success signal for this command).
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null || true
          if ! ls "$ANDROID_HOME/licenses/" 2>/dev/null | grep -q .; then
            echo "::error::No license files written under \$ANDROID_HOME/licenses — license acceptance likely failed."
            exit 1
          fi
          echo "==> Installing platforms;android-36 + build-tools;35.0.0 + platform-tools"
          # Same caveat: when sdkmanager finishes early, yes gets SIGPIPE.
          yes 2>/dev/null | "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;35.0.0" \
              >/dev/null || true
          # Sanity check that the install actually landed.
          test -d "$ANDROID_HOME/platforms/android-36" || { echo "::error::platforms/android-36 missing after install"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo "::error::build-tools/35.0.0 missing after install"; exit 1; }
          echo "==> SDK ready:"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Fetch libbox AAR
        # The AAR isn't vendored (~110 MB) and isn't committed (see
        # android/.gitignore). scripts/fetch-libbox.sh pulls from the
        # upstream Asterisk4Magisk/AndroidLibBoxLite release, with a
        # mirror fallback for environments where the GitHub release host
        # is slow.
        run: bash android/scripts/fetch-libbox.sh

      - name: Verify libbox AAR
        # Cheap integrity check — fail fast with a useful message rather
        # than letting Gradle choke on a 1 KB HTML error page from a mirror
        # outage. Size ≈110 MB ± 5 MB.
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s android/app/libs/libbox.aar)
          echo "libbox.aar size: $SIZE bytes"
          if [ "$SIZE" -lt 50000000 ]; then
            echo "::error::libbox.aar is suspiciously small — likely a downloaded HTML error page, not a real AAR."
            exit 1
          fi

      - name: Assemble debug APK
        # AGP downloads an x86_64 aapt2 on x86_64 runners automatically — no
        # override needed here. The arm64 dev-machine workaround lives in
        # android/README.md.
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Smoke-test the APK
        # aapt2 dump badging is a cheap sanity check that the build produced
        # a valid APK and that the manifest still references our entry
        # points. Catches the kind of failure where the build "succeeds"
        # but emits a half-merged APK after a resource conflict.
        env:
          # AGP picks up ANDROID_HOME / ANDROID_SDK_ROOT from the env; the
          # SDK setup step only exports them inside its own run block, so
          # re-export here for the smoke test.
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::APK missing or empty: $APK"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)
          "$AAPT" dump badging "$APK" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lxbox-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14