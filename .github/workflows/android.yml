# LxBox Android — Kotlin/Compose build
#
# Boots the Gradle wrapper for android/ and runs assembleDebug. Triggers on
# any push or PR that touches the Android subtree; Flutter changes go
# through .github/workflows/ci.yml, this one is decoupled.
#
# The Flutter `ci.yml` only triggers its `android` job on tag pushes or
# workflow_dispatch, so without this file our Kotlin sources would have no
# PR-time validation — every regression would slip through to the release
# tag. This workflow plugs that gap.
#
# We stay debug-only for now: signed release APKs require an upload keystore
# secret (Flutter ci.yml already uses ANDROID_KEYSTORE_BASE64 for that, and
# we can plug into the same secret when we're ready).

name: Android

on:
  push:
    branches: [main, develop]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # AGP reads ANDROID_HOME / ANDROID_SDK_ROOT from the env at task
      # start. We set them at the job level so assembleDebug and the
      # smoke-test step don't have to repeat the export. The path matches
      # where ubuntu-latest runners ship their preinstalled cmdline-tools.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        # Speeds up successive runs by ~30s on warm caches. Keyed on the lock
        # files so a libs.versions.toml bump invalidates the cache cleanly.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/build
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/build.gradle.kts', 'android/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        # Per actions/runner-images Ubuntu 24.04 README, ubuntu-latest
        # runners ship:
        #   - ANDROID_HOME=/usr/local/lib/android/sdk (already exported)
        #   - Android Command Line Tools 12.0
        #   - build-tools up to 37.0.0 (including our 35.0.0)
        #   - platform-tools 37.0.1
        #   - android-36 platform
        # That means we have *everything* we need preinstalled. The only
        # manual step is accepting the SDK licenses once so AGP / sdkmanager
        # write the hash files into $ANDROID_HOME/licenses/.
        #
        # Earlier attempts to run android-actions/setup-android failed
        # because its internal license-accept logic stalls on the
        # google-tv addon license (the cmdline-tools prints '6 of 7 SDK
        # package licenses not accepted. Review licenses that have not
        # been accepted (y/N)?' and waits on stdin that the action never
        # feeds enough). Doing it ourselves with 'yes | sdkmanager'
        # works: each 'y\n' consumed answers one license.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Discover the preinstalled cmdline-tools version. The runner
          # ships 12.0 in /usr/local/lib/android/sdk/cmdline-tools/12.0, but
          # future images might upgrade to 13.0 or 20.0. Pick whatever's
          # there rather than hard-coding.
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE_DIR="$(ls -d "$ANDROID_SDK"/cmdline-tools/* 2>/dev/null | sort -V | tail -1)"
          SDKMANAGER="$CMDLINE_DIR/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_SDK/cmdline-tools/"
            ls -la "$ANDROID_SDK/cmdline-tools/" || true
            exit 1
          fi
          echo "==> Using sdkmanager: $SDKMANAGER"
          # Pre-create the licenses dir so the first run doesn't fail on a
          # missing parent when writing the license-hash files.
          mkdir -p "$ANDROID_HOME/licenses"
          # Accept licenses. `yes` keeps streaming y's after sdkmanager
          # stops reading, so the pipe gets SIGPIPE on the `yes` side —
          # not an error for our purposes. Wrap in '|| true' and check
          # that license-hash files actually landed under $ANDROID_HOME/licenses/.
          echo "==> Accepting SDK licenses"
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null || true
          if ! ls "$ANDROID_HOME/licenses/" 2>/dev/null | grep -q .; then
            echo "::error::No license files written under \$ANDROID_HOME/licenses — license acceptance likely failed."
            exit 1
          fi
          echo "==> License files:"
          ls "$ANDROID_HOME/licenses/"
          # The platform packages are already preinstalled on the runner.
          # We still try the install command so the on-disk state matches
          # what build.gradle.kts declares (compileSdk=36, targetSdk=36,
          # buildToolsVersion=35.0.0). If a package is already installed,
          # sdkmanager is a no-op for it.
          echo "==> Reconciling installed packages (idempotent)"
          yes 2>/dev/null | "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;35.0.0" \
              >/dev/null || true
          # Sanity check that AGP-required pieces are present.
          for p in \
            "$ANDROID_HOME/platform-tools" \
            "$ANDROID_HOME/platforms/android-36" \
            "$ANDROID_HOME/build-tools/35.0.0"; do
            test -e "$p" || { echo "::error::required SDK path missing after install: $p"; exit 1; }
          done
          echo "==> SDK ready:"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Go (for gomobile)
        # The reF1nd source build drives gomobile, which needs a Go toolchain
        # matching the project's go.mod (go 1.25.5). Caching is off — the
        # workspace has no go.sum and setup-go's cache probe fails hard on
        # that instead of skipping.
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Build libbox AAR from reF1nd source
        # The AAR isn't vendored (~86 MB) and isn't committed (see
        # android/.gitignore). Instead of downloading a prebuilt binary we
        # build it from reF1nd/sing-box @ v1.15.0-alpha.3-reF1nd — the same
        # source pin as local builds. CI runners are x86_64, so the stock
        # gomobile + official NDK work without the aarch64-host patch.
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
        run: |
          set -euo pipefail
          REF_TAG=v1.15.0-alpha.3-reF1nd
          echo "==> clone reF1nd/sing-box @ $REF_TAG"
          git clone --depth 1 -b "$REF_TAG" https://github.com/reF1nd/sing-box.git /tmp/refsrc
          cd /tmp/refsrc
          git tag "$REF_TAG"

          echo "==> stub Go-1.25-incompatible linkname files"
          # pidfd_android.go linknames os.checkPidfdOnce, removed in newer Go.
          rm experimental/libbox/pidfd_android.go
          printf '%s\n' 'package libbox' '' '// Stub: the original file linknamed os.checkPidfdOnce, which newer' '// Go toolchains no longer export. pidfd is not required here.' > experimental/libbox/pidfd_android.go
          # oomprofile linknames runtime/pprof internals; replace with a stub.
          rm -rf experimental/libbox/internal/oomprofile
          mkdir -p experimental/libbox/internal/oomprofile
          printf '%s\n' '//go:build darwin || linux || windows' '' 'package oomprofile' '' 'import "errors"' '' 'func WriteFile(_ string, _ string) error {' '  return errors.New("oom profiling disabled in this build")' '}' > experimental/libbox/internal/oomprofile/oomprofile.go

          echo "==> install sagernet gomobile v0.1.13"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13

          echo "==> gomobile bind (all 4 ABIs, SDK 24)"
          "$(go env GOPATH)/bin/gomobile" bind \
            -o libbox.aar \
            -target android \
            -androidapi 24 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$REF_TAG -s -w" \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,tfogo_checklinkname0" \
            ./experimental/libbox

          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/android/app/libs/libbox.aar"
          echo "==> AAR ready: $(stat -c%s "$GITHUB_WORKSPACE/android/app/libs/libbox.aar") bytes"

      - name: Verify libbox AAR
        # Cheap integrity check — fail fast with a useful message rather
        # than letting Gradle choke on a truncated build artifact.
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s android/app/libs/libbox.aar)
          echo "libbox.aar size: $SIZE bytes"
          if [ "$SIZE" -lt 50000000 ]; then
            echo "::error::libbox.aar is suspiciously small — build likely failed partway."
            exit 1
          fi

      - name: Assemble debug APK
        # AGP downloads an x86_64 aapt2 on x86_64 runners automatically — no
        # override needed here. The arm64 dev-machine workaround lives in
        # android/README.md.
        working-directory: android
        # Use ./gradlew rather than a globally-installed gradle: ubuntu-latest
        # runner images ship gradle-wrapper.jar but no `gradle` binary in
        # PATH, so `gradle ...` would fail with 'command not found'. The
        # wrapper bootstraps a fresh 8.14.3 on first run (~25s) and caches
        # it under ~/.gradle/wrapper/dists/ for subsequent runs.
        #
        # Distribution download workaround: the wrapper's default URL
        # (services.gradle.org/distributions/...) 302-redirects to
        # github.com/gradle/gradle-distributions/releases/download/...
        # and that endpoint intermittently returns HTTP 504 on
        # github-hosted runners — observed across runs #5–#7 on
        # 2026-09-14, each failing mid-download after the wrapper had
        # already spent ~30s of budget on its retries.
        #
        # We instead pre-download the zip ourselves from a CDN mirror
        # (Tencent Cloud — same tarball, 137393837 bytes, verified
        # content matches), then point distributionUrl at the local
        # file:// so the wrapper doesn't touch the network at all.
        # On retry within the same job this becomes a no-op because the
        # file stays on disk.
        #
        # Run with --info so a failure prints enough context for diagnosis
        # without needing log-download access (which the public actions
        # API doesn't expose). On any failure, upload the tail of the
        # build log as a diagnostics artifact.
        run: |
          set +e
          GRADLE_ZIP=/tmp/gradle-8.14.3-bin.zip
          if [ ! -s "$GRADLE_ZIP" ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
              -o "$GRADLE_ZIP" \
              "https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip"
            CURL_RC=$?
            if [ "$CURL_RC" -ne 0 ] || [ ! -s "$GRADLE_ZIP" ]; then
              echo "::warning::Tencent mirror failed (rc=$CURL_RC), falling back to Aliyun"
              curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
                -o "$GRADLE_ZIP" \
                "https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.14.3-bin.zip"
            fi
          fi
          test -s "$GRADLE_ZIP" || { echo "::error::could not download gradle distribution"; exit 1; }
          echo "gradle zip: $(stat -c%s "$GRADLE_ZIP") bytes"
          sed -i "s|^distributionUrl=.*|distributionUrl=file\://$GRADLE_ZIP|" \
            gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties
          # Release keystore, when the repo has one configured. Same secret
          # names as the Flutter-side ci.yml so both clients can share the
          # upload key. Without the secret the release build falls back to
          # debug signing (build.gradle.kts handles that) — installable,
          # just not publishable.
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > key.jks
            {
              echo "storeFile=key.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > key.properties
            echo "==> upload keystore configured"
          else
            echo "==> no ANDROID_KEYSTORE_BASE64 secret; release build will use debug signing"
          fi
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --info 2>&1 | tee /tmp/assembleRelease.log
          ASSEMBLE_RC=${PIPESTATUS[0]}
          echo "==> gradle exit code: ${ASSEMBLE_RC}"
          if [ "${ASSEMBLE_RC}" -ne 0 ]; then
            # GitHub annotations cap message length and don't surface
            # raw_details to the public API, so we compact the build log
            # into a single-line message that's fully shown in the
            # checks tab. The full log also lands in the artifact below
            # for anyone who wants the unedited trace.
            #
            # Prefer explicit compiler diagnostics (Kotlin emits lines
            # starting 'e:', javac/kapt emit 'error:') over a raw tail:
            # the tail is usually gradle worker stack frames, which hide
            # the actual error. Fall back to a tail only when no such
            # lines exist.
            DIAG=$(grep -nE '^(e|w): |^error:|^ *error:|Caused by:|\.kt:[0-9]+:|\.java:[0-9]+:' /tmp/assembleRelease.log \
                    | head -n 80 | tr '\n' ' ' | tr -s ' ')
            if [ -z "$DIAG" ]; then
              DIAG=$(tail -n 200 /tmp/assembleRelease.log | tr '\n' ' ' | tr -s ' ')
            fi
            echo "::error title=assembleRelease failed (exit ${ASSEMBLE_RC})::${DIAG:0:14000}"
            mkdir -p android/build-diagnostics
            { echo '== compiler diagnostics =='; grep -nE '^(e|w): |^error:|Caused by:|\.kt:[0-9]+:|\.java:[0-9]+:' /tmp/assembleRelease.log | head -n 300; echo; echo '== raw tail =='; tail -n 500 /tmp/assembleRelease.log; } > android/build-diagnostics/assembleRelease.log 2>/dev/null || tail -n 800 /tmp/assembleRelease.log > android/build-diagnostics/assembleRelease.log
            [ -d android/build/reports ] && cp -r android/build/reports android/build-diagnostics/reports
            exit "${ASSEMBLE_RC}"
          fi
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lxbox-android-diag
          path: android/build-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

      - name: Smoke-test the APK
        # aapt2 dump badging is a cheap sanity check that the build produced
        # a valid APK and that the manifest still references our entry
        # points. Catches the kind of failure where the build "succeeds"
        # but emits a half-merged APK after a resource conflict.
        env:
          # AGP picks up ANDROID_HOME / ANDROID_SDK_ROOT from the env; the
          # SDK setup step only exports them inside its own run block, so
          # re-export here for the smoke test.
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK" || { echo "::error::APK missing or empty: $APK"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)
          "$AAPT" dump badging "$APK" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aibox-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14